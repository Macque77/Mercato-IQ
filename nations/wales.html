<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wales · Mercato IQ</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e17;
    --surface:#1a2332;
    --border:#3a4452;
    --text:#f0f2f5;
    --text-secondary:#a8adb8;
    --text-muted:#7a8291;
    --accent-gold:#e8c249;
    --accent-red:#ff3d47;
    --accent-green:#2ecc71;
    --tier1:#2ecc71;
    --tier2:#e8c249;
    --tier3:#f39c12;
    --display:'Anton',sans-serif;
    --body:'Archivo',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER ===== */
  header {
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(180deg, rgba(10,14,23,0.98), rgba(10,14,23,0.88));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:10px 20px;
  }

  .header-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }

  .logo {
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:inherit;
    font-family:var(--display);
    font-size:15px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .logo img {
    width:36px;
    height:36px;
    display:block;
  }

  .breadcrumb {
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    color:var(--text-muted);
    flex:1 1 auto;
    min-width:0;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }

  .breadcrumb::-webkit-scrollbar { display:none; }

  .breadcrumb a {
    color:var(--text-secondary);
    text-decoration:none;
    cursor:pointer;
  }

  .breadcrumb a:hover {
    color:var(--accent-gold);
  }

  /* ===== BREAKING TICKER (Sky Sports News style) ===== */
  .ticker-bar {
    display:none;
    align-items:stretch;
    background:linear-gradient(90deg, #2c0a0d, #1a2332 55%);
    border-bottom:1px solid var(--border);
    overflow:hidden;
    position:relative;
  }

  .ticker-label {
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--accent-red);
    color:#0a0e17;
    font-family:var(--mono);
    font-size:10px;
    font-weight:700;
    letter-spacing:1.2px;
    padding:7px 14px;
    text-transform:uppercase;
    z-index:2;
    box-shadow:6px 0 10px -2px rgba(0,0,0,0.45);
  }

  .ticker-dot {
    width:6px;
    height:6px;
    border-radius:50%;
    background:#0a0e17;
    animation:ticker-pulse 1.3s infinite;
    flex:none;
  }

  @keyframes ticker-pulse {
    0%, 100% { opacity:1; }
    50% { opacity:0.25; }
  }

  .ticker-viewport {
    flex:1;
    overflow:hidden;
    position:relative;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
  }

  .ticker-track {
    display:flex;
    align-items:center;
    width:max-content;
    animation-name:ticker-scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    animation-duration:40s;
  }

  .ticker-bar:hover .ticker-track,
  .ticker-bar:focus-within .ticker-track {
    animation-play-state:paused;
  }

  @keyframes ticker-scroll {
    from { transform:translateX(0); }
    to { transform:translateX(-50%); }
  }

  .ticker-item {
    flex:none;
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px 22px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-secondary);
    text-decoration:none;
    border-right:1px solid rgba(255,255,255,0.08);
    white-space:nowrap;
    transition:color 0.15s;
  }

  .ticker-item:hover { color:var(--text); }
  .ticker-item .t-name { color:var(--text); font-weight:700; }
  .ticker-item .t-route { color:var(--text-muted); }
  .ticker-item .t-prob { font-weight:700; }
  .ticker-item .t-prob.g { color:var(--accent-green); }
  .ticker-item .t-prob.y { color:var(--accent-gold); }
  .ticker-item .t-prob.o { color:#f39c12; }
  .ticker-item .t-prob.r { color:var(--accent-red); }
  .ticker-item .t-tier {
    font-size:8px;
    padding:1px 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation:none; overflow-x:auto; }
  }

  @media(max-width:768px) {
    .ticker-label { font-size:9px; padding:6px 9px; }
    .ticker-item { font-size:10px; padding:6px 14px; gap:6px; }
    .ticker-item .t-club { display:none; }
  }

  /* ===== HERO ===== */
  .hero {
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
    border-bottom:1px solid var(--border);
    padding:24px 20px;
  }

  .hero-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:20px;
  }

  /* League pills sit to the right of the nation name, making use of the wide banner
     instead of leaving it empty -- replaces the old separate full-width "Leagues"
     card grid below the hero. */
  .hero-leagues {
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-left:auto;
    max-width:60%;
    justify-content:flex-end;
  }

  .hero-league-pill {
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.02);
    text-decoration:none;
    color:var(--text-secondary);
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.3px;
    white-space:nowrap;
    transition:all 150ms ease;
  }

  .hero-league-pill:hover {
    color:var(--text);
    border-color:var(--accent-gold);
    transform:translateY(-1px);
  }

  .hero-league-pill .pill-count {
    font-size:9px;
    color:var(--text-muted);
    background:rgba(0,0,0,0.25);
    border-radius:999px;
    padding:1px 6px;
  }

  @media(max-width:900px) {
    .hero-inner { flex-wrap:wrap; }
    .hero-leagues { max-width:100%; justify-content:flex-start; margin-left:0; width:100%; }
  }

  .flag-display {
    flex-shrink:0;
    width:84px;
    height:84px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }

  .flag-display img {
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .flag-display .flag-fallback {
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-family:var(--display);
    font-size:28px;
    font-weight:400;
    letter-spacing:1px;
    color:var(--accent-gold);
    background:linear-gradient(135deg, rgba(232,194,73,0.15), rgba(255,61,71,0.08));
  }

  .hero-text h2 {
    font-family:var(--display);
    font-size:32px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }

  .hero-text .subtitle {
    color:var(--text-secondary);
    font-size:13px;
    display:flex;
    gap:16px;
  }

  .stat {
    display:flex;
    gap:4px;
    font-family:var(--mono);
    font-size:11px;
  }

  .stat-label {
    color:var(--text-muted);
    text-transform:uppercase;
  }

  .stat-value {
    color:var(--accent-gold);
    font-weight:700;
  }

  /* ===== CONTAINER ===== */
  .container {
    max-width:1400px;
    margin:0 auto;
    padding:28px 20px;
  }

  /* ===== LEAGUES SECTION ===== */
  .section {
    margin-bottom:28px;
  }

  .section-title {
    font-family:var(--display);
    font-size:18px;
    font-weight:400;
    letter-spacing:0.3px;
    text-transform:uppercase;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--accent-gold);
  }

  /* ===== NATION STATS STRIP =====
     Compact summary row -- live stories, leagues tracked, most active league --
     built entirely from data already aggregated for this page. */
  .stats-strip {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
    margin-bottom:24px;
  }

  .stats-tile {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
  }

  .stats-tile .stats-label {
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:5px;
  }

  .stats-tile .stats-value {
    font-family:var(--display);
    font-size:19px;
    font-weight:400;
    letter-spacing:0.3px;
    color:var(--accent-gold);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .stats-tile .stats-value small {
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-secondary);
    font-weight:400;
    letter-spacing:0;
    text-transform:none;
  }

  /* ===== TRANSFER CARDS ===== */
  .transfer-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:12px;
  }

  .transfer-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    transition:all 200ms ease;
    position:relative;
  }

  .transfer-card:hover {
    border-color:var(--accent-gold);
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
  }

  a.transfer-card {
    display:block;
    color:inherit;
    text-decoration:none;
    cursor:pointer;
  }

  .bullshit-tag {
    position:absolute;
    top:8px;
    right:8px;
    background:var(--accent-red);
    color:white;
    padding:4px 8px;
    border-radius:4px;
    font-family:var(--mono);
    font-size:8px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    animation:shake 3s ease-in-out infinite;
    z-index:1;
  }

  @keyframes shake {
    0%, 100% { transform:rotate(-2deg); }
    50% { transform:rotate(2deg); }
  }

  .card-header {
    padding:10px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
  }

  .card-player {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
    gap:6px;
  }

  .player-name {
    font-family:var(--display);
    font-size:13px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.3px;
    color:var(--accent-gold);
  }

  .tier-badge {
    display:inline-block;
    padding:2px 6px;
    background:var(--bg);
    border:1px solid;
    border-radius:3px;
    font-family:var(--mono);
    font-size:8px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    white-space:nowrap;
  }

  .tier-badge.t1 { color:var(--tier1); border-color:var(--tier1); }
  .tier-badge.t2 { color:var(--tier2); border-color:var(--tier2); }
  .tier-badge.t3 { color:var(--tier3); border-color:var(--tier3); }

  .club-name {
    font-family:var(--mono);
    font-size:12px;
    font-weight:600;
    color:var(--text);
  }

  .card-body {
    padding:10px;
  }

  .transfer-direction {
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-size:11px;
  }

  .direction-icon {
    font-size:14px;
  }

  .direction-icon.in { color:var(--accent-green); }
  .direction-icon.out { color:var(--accent-red); }

  .transfer-details {
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
    line-height:1.4;
  }

  .transfer-details div:last-child {
    color:var(--accent-gold);
    margin-top:3px;
  }

  .card-footer {
    padding:10px;
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
  }

  .metric {
    flex:1;
  }

  .metric-label {
    font-family:var(--mono);
    font-size:8px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:3px;
  }

  .metric-bar {
    height:3px;
    background:rgba(0,0,0,0.3);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:2px;
  }

  .metric-fill {
    height:100%;
    /* Fallback only -- actual colour is set inline per-card by metricGradient(), driven
       by the value itself (see script below), so this static gradient is rarely seen. */
    background:linear-gradient(90deg, var(--accent-gold), var(--accent-red));
    border-radius:999px;
  }

  .metric-value {
    font-family:var(--mono);
    font-size:9px;
    font-weight:600;
    color:var(--text);
  }

  .empty {
    grid-column:1/-1;
    text-align:center;
    padding:32px 20px;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:12px;
    border:1px dashed var(--border);
    border-radius:8px;
  }

  footer {
    border-top:1px solid var(--border);
    padding:20px 24px;
    text-align:center;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:10px;
  }

  @media(max-width:768px) {
    .hero-inner {
      flex-direction:column;
      text-align:center;
      gap:16px;
    }

    .hero-text .subtitle {
      flex-direction:column;
      gap:10px;
    }

    .transfer-grid {
      grid-template-columns:1fr;
    }

    .logo {
      font-size:11px;
    }

    .hero-text h2 {
      font-size:24px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">
      <img src="../mercato-mark.svg" alt="">
      <span>Mercato IQ</span>
    </a>
    <div class="breadcrumb">
      <a href="/">Global</a>
      <span>/</span>
      <span style="color:var(--accent-gold)">Wales</span>
    </div>
  </div>
</header>

<div class="ticker-bar" id="ticker-bar">
  <div class="ticker-label"><span class="ticker-dot"></span>Wales</div>
  <div class="ticker-viewport">
    <div class="ticker-track" id="ticker-track"></div>
  </div>
</div>

<div class="hero">
  <div class="hero-inner">
    <div class="flag-display">
      <img src="https://flagcdn.com/gb-wls.svg" alt="Wales flag" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <div class="flag-fallback">WLS</div>
    </div>
    <div class="hero-text">
      <h2>Wales</h2>
      <div class="subtitle">
        <div class="stat">
          <span class="stat-label">Stories:</span>
          <span class="stat-value">0</span>
        </div>
      </div>
    </div>
    <nav class="hero-leagues" id="hero-leagues" aria-label="Leagues in this nation">
      <!-- Populated by data -->
    </nav>
  </div>
</div>

<div class="container">
  <div class="stats-strip" id="stats-strip">
    <!-- Populated by data -->
  </div>

  <section class="section">
    <h3 class="section-title">Top Transfer Stories</h3>
    <div class="transfer-grid" id="stories">
      <!-- Populated by data -->
    </div>
  </section>
</div>

<footer>
  <p>&copy; 2026 Mercato IQ · Transfer Intelligence · No Bullshit</p>
</footer>

<script>
/*==DATA==*/
/* ============================================================
   MERCATO IQ · NATION DATA · Wales
   Generated by engine/aggregate.py. Never hand-edit.
   ============================================================ */

const NATION = {
  name: "Wales",
  flag_emoji: "🏴󠁧󠁢󠁷󠁬󠁳󠁿",
  stories_count: 0
};

const TOP_STORIES = [];

const BY_LEAGUE = {"Championship": 0, "Cymru Premier": 0};

const LEAGUES_LIST = [{"slug": "championship", "name": "Championship", "count": 0}, {"slug": "cymru-premier", "name": "Cymru Premier", "count": 0}];

const REPORT_META = {
  asof: "06 Aug 2026",
  updated: "2026-08-06T13:55:47.442812Z",
  label: "Nation aggregation"
};

/*==ENDDATA==*/

// Prob metric bar: colour driven by the value itself, on the same four-band scale as
// the decoder legend (Likely 50%+ / Live in the mix / Long shot / Unlikely). Bands
// match the site-wide light-band rule: g>50, y>=30, o>=15, r<15.
// Declared before the render IIFE below so it's initialised before first use.
const METRIC_BAND_COLORS = { g: '46,204,113', y: '232,194,73', o: '243,156,18', r: '255,61,71' };
function metricBand(v) {
  const n = Number(v) || 0;
  if (n > 50) return 'g';
  if (n >= 30) return 'y';
  if (n >= 15) return 'o';
  return 'r';
}
function metricGradient(v) {
  const rgb = METRIC_BAND_COLORS[metricBand(v)];
  return `linear-gradient(90deg, rgba(${rgb},0.45), rgb(${rgb}))`;
}

(function(){
  // Nation stats strip -- built entirely from data already aggregated for this page
  // (NATION.stories_count, LEAGUES_LIST's per-league counts), so every figure is real.
  (function(){
    const strip = document.getElementById('stats-strip');
    if(!strip) return;
    const tiles = [];
    if(typeof NATION !== 'undefined' && NATION) {
      tiles.push({ label: 'Live Stories', value: `${NATION.stories_count || 0}` });
    }
    if(typeof LEAGUES_LIST !== 'undefined' && LEAGUES_LIST && LEAGUES_LIST.length > 0) {
      tiles.push({ label: 'Leagues Tracked', value: `${LEAGUES_LIST.length}` });
      const topLeague = LEAGUES_LIST.slice().sort((a, b) => (b.count || 0) - (a.count || 0))[0];
      if(topLeague && topLeague.count > 0) {
        tiles.push({ label: 'Most Active League', value: topLeague.name, small: `${topLeague.count} ${topLeague.count === 1 ? 'story' : 'stories'}` });
      }
    }
    if(typeof TOP_STORIES !== 'undefined' && TOP_STORIES && TOP_STORIES.length > 0) {
      const tier1 = TOP_STORIES.filter(s => (s.tier || 3) === 1).length;
      tiles.push({ label: 'Tier 1 Stories', value: `${tier1}` });
    }
    if(tiles.length === 0) return;
    strip.innerHTML = tiles.map(t => `
      <div class="stats-tile">
        <div class="stats-label">${t.label}</div>
        <div class="stats-value">${t.value}${t.small ? ` <small>${t.small}</small>` : ''}</div>
      </div>
    `).join('');
  })();

  // Populate league pills in the hero banner. aggregate.py emits this array as
  // LEAGUES_LIST with a {slug,name,count} shape -- NOT "LEAGUES" / "club_count" (that
  // mismatch used to leave this permanently empty even when data existed).
  const heroLeagues = document.getElementById('hero-leagues');
  if(heroLeagues) {
    if(typeof LEAGUES_LIST !== 'undefined' && LEAGUES_LIST && LEAGUES_LIST.length > 0) {
      heroLeagues.innerHTML = LEAGUES_LIST.map(l => `
        <a href="../leagues/${l.slug}.html" class="hero-league-pill">
          ${l.name}<span class="pill-count">${l.count || 0}</span>
        </a>
      `).join('');
    } else {
      heroLeagues.style.display = 'none';
    }
  }

  // Populate transfer stories -- ranked by likelihood (Probability) descending
  if(typeof TOP_STORIES !== 'undefined' && TOP_STORIES && TOP_STORIES.length > 0) {
    const container = document.getElementById('stories');
    const ranked = TOP_STORIES.slice().sort((a, b) => (b.prob || 0) - (a.prob || 0));
    container.innerHTML = ranked.map(s => renderStory(s)).join('');
  } else {
    const container = document.getElementById('stories');
    if(container) container.innerHTML = '<div class="empty">No stories yet</div>';
  }

  // Breaking ticker: latest/highest-likelihood stories for this scope, excluding
  // flagged-bullshit claims.
  if(typeof TOP_STORIES !== 'undefined' && TOP_STORIES && TOP_STORIES.length > 0) {
    initTicker(TOP_STORIES.filter(s => !s.bullshit), renderTickerStory);
  }
})();

function slugifyName(s) {
  return (s || '').toString().toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// Sky Sports-style breaking ticker: a small, ranked snapshot (not the full feed),
// auto-scrolling via CSS transform (no real horizontal scrollbar), paused on hover
// and honouring prefers-reduced-motion. renderFn maps one story to a <a class="ticker-item">.
function initTicker(items, renderFn, limit) {
  const bar = document.getElementById('ticker-bar');
  const track = document.getElementById('ticker-track');
  if (!bar || !track || !items || items.length === 0) return;
  const top = items.slice().sort((a, b) => (b.prob || 0) - (a.prob || 0)).slice(0, limit || 15);
  if (top.length === 0) return;
  const html = top.map(renderFn).join('');
  track.innerHTML = html + html; // duplicated once for a seamless loop
  bar.style.display = 'flex';
  requestAnimationFrame(() => {
    const halfWidth = track.scrollWidth / 2;
    const duration = Math.max(22, Math.round(halfWidth / 55)); // ~55px/sec, floor for very short lists
    track.style.animationDuration = duration + 's';
  });
}

function renderTickerStory(s) {
  const tier = s.tier || 3;
  const prob = s.prob || 0;
  const band = metricBand(prob);
  const href = s.club_origin ? `../${s.club_origin}.html#t-${slugifyName(s.name)}` : '#';
  return `<a href="${href}" class="ticker-item">
    <span class="tier-badge t${tier} t-tier">T${tier}</span>
    <span class="t-name">${s.name}</span>
    <span class="t-club">${s.club_display_name}</span>
    <span class="t-route">${s.from} → ${s.to}</span>
    <span class="t-prob ${band}">${prob}%</span>
  </a>`;
}



function renderStory(s) {
  const tier = s.tier || 3;
  const tierLabel = ['', 'T1', 'T2', 'T3'][tier] || 'T' + tier;
  const prob = s.prob || 50;
  const truth = s.truth || 50;
  const isBullshit = s.bullshit === true;
  const bullTag = isBullshit ? '<div class="bullshit-tag">Bullshit</div>' : '';
  const href = s.club_origin ? `../${s.club_origin}.html#t-${slugifyName(s.name)}` : '#';

  return `<a href="${href}" class="transfer-card">
    ${bullTag}
    <div class="card-header">
      <div class="card-player">
        <span class="player-name">${s.name}</span>
        <span class="tier-badge t${tier}">${tierLabel}</span>
      </div>
      <div class="club-name">${s.from} → ${s.to}</div>
    </div>
    <div class="card-body">
      <div class="transfer-direction">
        <div class="transfer-details">
          <div>${s.value}</div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <div class="metric">
        <div class="metric-label">Prob</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${prob}%;background:${metricGradient(prob)}"></div></div>
        <div class="metric-value">${prob}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">True</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${truth}%;background:${metricGradient(truth)}"></div></div>
        <div class="metric-value">${truth}%</div>
      </div>
    </div>
  </a>`;
}
</script>
