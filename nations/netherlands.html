<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netherlands · Mercato IQ</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e17;
    --surface:#1a2332;
    --border:#3a4452;
    --text:#f0f2f5;
    --text-secondary:#a8adb8;
    --text-muted:#7a8291;
    --accent-gold:#e8c249;
    --accent-red:#ff3d47;
    --accent-green:#2ecc71;
    --tier1:#2ecc71;
    --tier2:#e8c249;
    --tier3:#f39c12;
    --display:'Anton',sans-serif;
    --body:'Archivo',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER ===== */
  header {
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(180deg, rgba(10,14,23,0.98), rgba(10,14,23,0.88));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:10px 20px;
  }

  .header-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }

  .logo {
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:inherit;
    font-family:var(--display);
    font-size:15px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .logo img {
    width:36px;
    height:36px;
    display:block;
  }

  .breadcrumb {
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .breadcrumb a {
    color:var(--text-secondary);
    text-decoration:none;
    cursor:pointer;
  }

  .breadcrumb a:hover {
    color:var(--accent-gold);
  }

  /* ===== HERO ===== */
  .hero {
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
    border-bottom:1px solid var(--border);
    padding:24px 20px;
  }

  .hero-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:20px;
  }

  .flag-display {
    flex-shrink:0;
    width:84px;
    height:84px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }

  .flag-display img {
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .flag-display .flag-fallback {
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-family:var(--display);
    font-size:28px;
    font-weight:400;
    letter-spacing:1px;
    color:var(--accent-gold);
    background:linear-gradient(135deg, rgba(232,194,73,0.15), rgba(255,61,71,0.08));
  }

  .hero-text h2 {
    font-family:var(--display);
    font-size:32px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }

  .hero-text .subtitle {
    color:var(--text-secondary);
    font-size:13px;
    display:flex;
    gap:16px;
  }

  .stat {
    display:flex;
    gap:4px;
    font-family:var(--mono);
    font-size:11px;
  }

  .stat-label {
    color:var(--text-muted);
    text-transform:uppercase;
  }

  .stat-value {
    color:var(--accent-gold);
    font-weight:700;
  }

  /* ===== CONTAINER ===== */
  .container {
    max-width:1400px;
    margin:0 auto;
    padding:28px 20px;
  }

  /* ===== LEAGUES SECTION ===== */
  .section {
    margin-bottom:28px;
  }

  .section-title {
    font-family:var(--display);
    font-size:18px;
    font-weight:400;
    letter-spacing:0.3px;
    text-transform:uppercase;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--accent-gold);
  }

  .leagues-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:10px;
    margin-bottom:24px;
  }

  .league-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    text-align:center;
    cursor:pointer;
    transition:all 200ms ease;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:70px;
    justify-content:center;
  }

  .league-card:hover {
    border-color:var(--accent-gold);
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
  }

  .league-name {
    font-family:var(--display);
    font-size:12px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.2px;
  }

  .league-meta {
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
  }

  /* ===== TRANSFER CARDS ===== */
  .transfer-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:12px;
  }

  .transfer-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    transition:all 200ms ease;
    position:relative;
  }

  .transfer-card:hover {
    border-color:var(--accent-gold);
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
  }

  a.transfer-card {
    display:block;
    color:inherit;
    text-decoration:none;
    cursor:pointer;
  }

  .bullshit-tag {
    position:absolute;
    top:8px;
    right:8px;
    background:var(--accent-red);
    color:white;
    padding:4px 8px;
    border-radius:4px;
    font-family:var(--mono);
    font-size:8px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    animation:shake 3s ease-in-out infinite;
    z-index:1;
  }

  @keyframes shake {
    0%, 100% { transform:rotate(-2deg); }
    50% { transform:rotate(2deg); }
  }

  .card-header {
    padding:10px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
  }

  .card-player {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
    gap:6px;
  }

  .player-name {
    font-family:var(--display);
    font-size:13px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.3px;
    color:var(--accent-gold);
  }

  .tier-badge {
    display:inline-block;
    padding:2px 6px;
    background:var(--bg);
    border:1px solid;
    border-radius:3px;
    font-family:var(--mono);
    font-size:8px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    white-space:nowrap;
  }

  .tier-badge.t1 { color:var(--tier1); border-color:var(--tier1); }
  .tier-badge.t2 { color:var(--tier2); border-color:var(--tier2); }
  .tier-badge.t3 { color:var(--tier3); border-color:var(--tier3); }

  .club-name {
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
  }

  .card-body {
    padding:10px;
  }

  .transfer-direction {
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-size:11px;
  }

  .direction-icon {
    font-size:14px;
  }

  .direction-icon.in { color:var(--accent-green); }
  .direction-icon.out { color:var(--accent-red); }

  .transfer-details {
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
    line-height:1.4;
  }

  .transfer-details div:last-child {
    color:var(--accent-gold);
    margin-top:3px;
  }

  .card-footer {
    padding:10px;
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
  }

  .metric {
    flex:1;
  }

  .metric-label {
    font-family:var(--mono);
    font-size:8px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:3px;
  }

  .metric-bar {
    height:3px;
    background:rgba(0,0,0,0.3);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:2px;
  }

  .metric-fill {
    height:100%;
    /* Fallback only -- actual colour is set inline per-card by metricGradient(), driven
       by the value itself (see script below), so this static gradient is rarely seen. */
    background:linear-gradient(90deg, var(--accent-gold), var(--accent-red));
    border-radius:999px;
  }

  .metric-value {
    font-family:var(--mono);
    font-size:9px;
    font-weight:600;
    color:var(--text);
  }

  .empty {
    grid-column:1/-1;
    text-align:center;
    padding:32px 20px;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:12px;
    border:1px dashed var(--border);
    border-radius:8px;
  }

  footer {
    border-top:1px solid var(--border);
    padding:20px 24px;
    text-align:center;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:10px;
  }

  @media(max-width:768px) {
    .hero-inner {
      flex-direction:column;
      text-align:center;
      gap:16px;
    }

    .hero-text .subtitle {
      flex-direction:column;
      gap:10px;
    }

    .transfer-grid {
      grid-template-columns:1fr;
    }

    .leagues-grid {
      grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    }

    .logo {
      font-size:11px;
    }

    .hero-text h2 {
      font-size:24px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">
      <img src="../mercato-mark.svg" alt="">
      <span>Mercato IQ</span>
    </a>
    <div class="breadcrumb">
      <a href="/">Global</a>
      <span>/</span>
      <span style="color:var(--accent-gold)">Netherlands</span>
    </div>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <div class="flag-display">
      <img src="https://flagcdn.com/nl.svg" alt="Netherlands flag" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <div class="flag-fallback">NL</div>
    </div>
    <div class="hero-text">
      <h2>Netherlands</h2>
      <div class="subtitle">
        <div class="stat">
          <span class="stat-label">Stories:</span>
          <span class="stat-value">4</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <section class="section">
    <h3 class="section-title">Leagues</h3>
    <div class="leagues-grid" id="leagues-grid">
      <!-- Populated by data -->
    </div>
  </section>

  <section class="section">
    <h3 class="section-title">Top Transfer Stories</h3>
    <div class="transfer-grid" id="stories">
      <!-- Populated by data -->
    </div>
  </section>
</div>

<footer>
  <p>&copy; 2026 Mercato IQ · Transfer Intelligence · No Bullshit</p>
</footer>

<script>
/*==DATA==*/
/* ============================================================
   MERCATO IQ · NATION DATA · Netherlands
   Generated by engine/aggregate.py. Never hand-edit.
   ============================================================ */

const NATION = {
  name: "Netherlands",
  flag_emoji: "🇳🇱",
  stories_count: 4
};

const TOP_STORIES = [  {
    name: "Xavi Simons",prob: 65, bullshit: false,
    club_origin: "psv-eindhoven", club_display_name: "PSV Eindhoven", direction: "in",
    from: "PSV Eindhoven (loan from Leipzig)", to: "PSV Eindhoven",
    tier: 2, coverage: 2, coverage_trend: 'flat',
    value: "Loan + option", updated: "2026-08-03T14:30:00Z", league: "Eredivisie"
  },
  {
    name: "Jarrad Branthwaite",prob: 42, bullshit: false,
    club_origin: "feyenoord", club_display_name: "Feyenoord Rotterdam", direction: "in",
    from: "Everton", to: "Feyenoord Rotterdam",
    tier: 2, coverage: 1, coverage_trend: 'flat',
    value: "€40m loan option", updated: "2026-08-03T14:30:00Z", league: "Eredivisie"
  },
  {
    name: "Tomás Bisuma",prob: 40, bullshit: false,
    club_origin: "sc-heerenveen", club_display_name: "SC Heerenveen", direction: "in",
    from: "Fiorentina", to: "SC Heerenveen",
    tier: 2, coverage: 1, coverage_trend: 'flat',
    value: "€15m", updated: "2026-08-03T14:30:00Z", league: "Eredivisie"
  },
  {
    name: "Orkun Kökçü",prob: 35, bullshit: false,
    club_origin: "ajax", club_display_name: "AFC Ajax", direction: "in",
    from: "Benfica", to: "AFC Ajax",
    tier: 2, coverage: 1, coverage_trend: 'flat',
    value: "€30m", updated: "2026-08-03T14:30:00Z", league: "Eredivisie"
  },
];

const BY_LEAGUE = {"Eredivisie": 4, "Eerste Divisie": 0};

const LEAGUES_LIST = [{"slug": "eredivisie", "name": "Eredivisie", "count": 4}, {"slug": "eerste-divisie", "name": "Eerste Divisie", "count": 0}];

const REPORT_META = {
  asof: "04 Aug 2026",
  updated: "2026-08-04T09:13:24.087193Z",
  label: "Nation aggregation"
};

/*==ENDDATA==*/

// Prob metric bar: colour driven by the value itself, on the same four-band scale as
// the decoder legend (Likely 50%+ / Live in the mix / Long shot / Unlikely). Bands
// match the site-wide light-band rule: g>50, y>=30, o>=15, r<15.
// Declared before the render IIFE below so it's initialised before first use.
const METRIC_BAND_COLORS = { g: '46,204,113', y: '232,194,73', o: '243,156,18', r: '255,61,71' };
function metricBand(v) {
  const n = Number(v) || 0;
  if (n > 50) return 'g';
  if (n >= 30) return 'y';
  if (n >= 15) return 'o';
  return 'r';
}
function metricGradient(v) {
  const rgb = METRIC_BAND_COLORS[metricBand(v)];
  return `linear-gradient(90deg, rgba(${rgb},0.45), rgb(${rgb}))`;
}

(function(){
  // Populate leagues grid. aggregate.py emits this array as LEAGUES_LIST with a
  // {slug,name,count} shape -- NOT "LEAGUES" / "club_count" (that mismatch used to leave
  // this grid permanently empty even when data existed).
  if(typeof LEAGUES_LIST !== 'undefined' && LEAGUES_LIST && LEAGUES_LIST.length > 0) {
    const container = document.getElementById('leagues-grid');
    container.innerHTML = LEAGUES_LIST.map(l => `
      <a href="../leagues/${l.slug}.html" class="league-card">
        <div class="league-name">${l.name}</div>
        <div class="league-meta">${l.count || 0} stories</div>
      </a>
    `).join('');
  } else {
    const container = document.getElementById('leagues-grid');
    if(container) container.innerHTML = '<div class="empty">No league data yet</div>';
  }

  // Populate transfer stories -- ranked by likelihood (Probability) descending
  if(typeof TOP_STORIES !== 'undefined' && TOP_STORIES && TOP_STORIES.length > 0) {
    const container = document.getElementById('stories');
    const ranked = TOP_STORIES.slice().sort((a, b) => (b.prob || 0) - (a.prob || 0));
    container.innerHTML = ranked.map(s => renderStory(s)).join('');
  } else {
    const container = document.getElementById('stories');
    if(container) container.innerHTML = '<div class="empty">No stories yet</div>';
  }
})();

function slugifyName(s) {
  return (s || '').toString().toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}


function renderStory(s) {
  const tier = s.tier || 3;
  const tierLabel = ['', 'T1', 'T2', 'T3'][tier] || 'T' + tier;
  const prob = s.prob || 50;
  const isBullshit = s.bullshit === true;
  const direction = s.direction === 'out' ? '→' : '←';
  const dirClass = s.direction === 'out' ? 'out' : 'in';
  const bullTag = isBullshit ? '<div class="bullshit-tag">Bullshit</div>' : '';
  const href = s.club_origin ? `../${s.club_origin}.html#t-${slugifyName(s.name)}` : '#';

  return `<a href="${href}" class="transfer-card">
    ${bullTag}
    <div class="card-header">
      <div class="card-player">
        <span class="player-name">${s.name}</span>
        <span class="tier-badge t${tier}">${tierLabel}</span>
      </div>
      <div class="club-name">${s.club_display_name}</div>
    </div>
    <div class="card-body">
      <div class="transfer-direction">
        <span class="direction-icon ${dirClass}">${direction}</span>
        <div class="transfer-details">
          <div>${s.from} → ${s.to}</div>
          <div>${s.value}</div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <div class="metric">
        <div class="metric-label">Prob</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${prob}%;background:${metricGradient(prob)}"></div></div>
        <div class="metric-value">${prob}%</div>
      </div>
    </div>
  </a>`;
}
</script>

</body>
</html>
