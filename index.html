<style>
  :root {
    --bg:#0a0e17;
    --surface:#1a2332;
    --border:#3a4452;
    --text:#f0f2f5;
    --text-secondary:#a8adb8;
    --text-muted:#7a8291;
    --accent-gold:#e8c249;
    --accent-red:#ff3d47;
    --accent-green:#2ecc71;
    --tier1:#2ecc71;
    --tier2:#e8c249;
    --tier3:#f39c12;

    --body:'Archivo',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER ===== */
  header {
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(180deg, rgba(10,14,23,0.98), rgba(10,14,23,0.88));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:8px 16px;
  }

  .header-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }

  .logo {
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:inherit;
    font-family:var(--display);
    font-size:14px;
    font-weight:400;
    letter-spacing:0.3px;
    text-transform:uppercase;
  }

  .logo img {
    width:36px;
    height:36px;
    display:block;
  }

  .nav-links {
    display:flex;
    gap:12px;
    font-family:var(--mono);
    font-size:9px;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .nav-links a {
    color:var(--text-secondary);
    text-decoration:none;
    cursor:pointer;
  }

  .nav-links a:hover {
    color:var(--accent-gold);
  }

  /* ===== HERO ===== */
  .hero {
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
    border-bottom:1px solid var(--border);
    padding:16px;
    text-align:center;
    margin-bottom:12px;
  }

  .hero h1 {
    font-family:var(--display);
    font-size:28px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }

  .hero p {
    font-size:12px;
    color:var(--text-secondary);
  }

  /* ===== NATIONS BAR ===== */
  .nations-bar {
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:8px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  .nations-bar::-webkit-scrollbar { display:none; }

  .nation-tag {
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px 10px 4px 4px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:999px;
    text-decoration:none;
    color:var(--text-secondary);
    white-space:nowrap;
    transition:all 150ms ease;
    cursor:pointer;
    font-size:11px;
    font-family:var(--mono);
    text-transform:uppercase;
  }

  .nation-tag:hover {
    border-color:var(--accent-gold);
    background:rgba(232,194,73,0.1);
    color:var(--accent-gold);
  }

  .nation-tag img {
    width:20px;
    height:14px;
    object-fit:cover;
    border-radius:2px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.15);
  }

  .nation-tag .flag-fallback-text {
    display:none;
    width:20px;
    height:14px;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:700;
    background:var(--surface);
    border-radius:2px;
  }

  /* ===== CONTAINER ===== */
  .container {
    max-width:1400px;
    margin:0 auto;
    padding:8px 16px;
  }

  .section-title {
    font-family:var(--display);
    font-size:14px;
    font-weight:400;
    letter-spacing:0.2px;
    text-transform:uppercase;
    margin:12px 0 8px 0;
    padding-bottom:4px;
    border-bottom:1px solid var(--accent-gold);
  }

  /* ===== TRANSFER FEED ===== */
  .feed {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:8px;
    margin-bottom:16px;
  }

  .transfer-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
    transition:all 150ms ease;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .transfer-card:hover {
    border-color:var(--accent-gold);
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
  }

  a.transfer-card {
    color:inherit;
    text-decoration:none;
    cursor:pointer;
  }

  .bullshit-tag {
    position:absolute;
    top:4px;
    right:4px;
    background:var(--accent-red);
    color:white;
    padding:3px 6px;
    border-radius:3px;
    font-family:var(--mono);
    font-size:7px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    animation:shake 3s ease-in-out infinite;
    z-index:1;
  }

  @keyframes shake {
    0%, 100% { transform:rotate(-2deg); }
    50% { transform:rotate(2deg); }
  }

  .card-header {
    padding:8px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
  }

  .card-player {
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:4px;
    margin-bottom:2px;
  }

  .player-name {
    font-family:var(--display);
    font-size:11px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.2px;
    color:var(--accent-gold);
    flex:1;
    word-break:break-word;
  }

  .tier-badge {
    display:inline-block;
    padding:1px 4px;
    background:var(--bg);
    border:1px solid;
    border-radius:2px;
    font-family:var(--mono);
    font-size:7px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    white-space:nowrap;
    flex-shrink:0;
  }

  .tier-badge.t1 { color:var(--tier1); border-color:var(--tier1); }
  .tier-badge.t2 { color:var(--tier2); border-color:var(--tier2); }
  .tier-badge.t3 { color:var(--tier3); border-color:var(--tier3); }

  .card-subtitle {
    font-family:var(--mono);
    font-size:9px;
    color:var(--text-muted);
  }

  .card-body {
    padding:6px;
    flex:1;
  }

  .transfer-direction {
    display:flex;
    align-items:flex-start;
    gap:4px;
    margin-bottom:3px;
    font-size:10px;
  }

  .direction-arrow {
    font-size:11px;
    flex-shrink:0;
    line-height:1;
    color:var(--accent-red);
  }

  .direction-arrow.in { color:var(--accent-green); }

  .transfer-details {
    font-family:var(--mono);
    font-size:8px;
    color:var(--text-muted);
    line-height:1.3;
  }

  .transfer-details div:last-child {
    color:var(--accent-gold);
    margin-top:1px;
  }

  .card-footer {
    padding:6px;
    border-top:1px solid var(--border);
    display:flex;
    gap:6px;
  }

  .metric {
    flex:1;
    min-width:0;
  }

  .metric-label {
    font-family:var(--mono);
    font-size:7px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:1px;
  }

  .metric-bar {
    height:2px;
    background:rgba(0,0,0,0.3);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:1px;
  }

  .metric-fill {
    height:100%;
    background:linear-gradient(90deg, var(--accent-gold), var(--accent-red));
    border-radius:999px;
  }

  .metric-value {
    font-family:var(--mono);
    font-size:8px;
    font-weight:600;
    color:var(--text);
  }

  footer {
    border-top:1px solid var(--border);
    padding:12px 16px;
    text-align:center;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:9px;

    }
  }

  @media(max-width:480px) {
    .feed {
      grid-template-columns:1fr;
    }

    .nations-bar {
      padding:6px 8px;
    }
  }
</style>

// flagcdn.com codes, mirrored from engine/build_extended.py's FLAG_CODES. Real flag images
// instead of unicode flag emoji -- Windows Chrome/Edge deliberately render regional-indicator
// emoji as plain two-letter codes (no flag glyphs), so emoji-only flags looked broken there.
const FLAG_CODES = {
  england: 'gb-eng', scotland: 'gb-sct', wales: 'gb-wls', spain: 'es', france: 'fr',
  italy: 'it', germany: 'de', netherlands: 'nl', portugal: 'pt', belgium: 'be',
  greece: 'gr', turkey: 'tr', sweden: 'se'
};

(function(){
  // Populate nations bar
  if(typeof NATIONS !== 'undefined' && NATIONS && NATIONS.length > 0) {
    const bar = document.getElementById('nations-bar');
    bar.innerHTML = NATIONS.map(n => {
      const code = FLAG_CODES[n.slug];
      const img = code
        ? `<img src="https://flagcdn.com/${code}.svg" alt="${n.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const fallback = (code ? code.split('-').pop() : n.slug.slice(0,2)).toUpperCase();
      return `<a href="nations/${n.slug}.html" class="nation-tag">
        ${img}
        <span class="flag-fallback-text" style="display:${code ? 'none' : 'flex'}">${fallback}</span>
        <span>${n.name}</span>
      </a>`;
    }).join('');
  }

  // Populate headlines feed
  if(typeof HEADLINES !== 'undefined' && HEADLINES && HEADLINES.length > 0) {
    const feed = document.getElementById('feed');
    feed.innerHTML = HEADLINES.map(h => renderHeadline(h)).join('');
  }
})();

function renderHeadline(h) {
  const tier = h.tier || 3;
  const tierLabel = ['', 'T1', 'T2', 'T3'][tier] || 'T' + tier;
  const prob = h.prob || 50;
  const isBullshit = prob < 35;
  const direction = h.direction === 'out' ? '→' : '←';
  const dirClass = h.direction === 'out' ? 'out' : 'in';
  const bullTag = isBullshit ? '<div class="bullshit-tag">Bullshit</div>' : '';
  const href = h.club_origin ? `${h.club_origin}.html` : '#';

  return `<a href="${href}" class="transfer-card card-link">
    ${bullTag}
    <div class="card-header">
      <div class="card-player">
        <span class="player-name">${h.headline}</span>
        <span class="tier-badge t${tier}">${tierLabel}</span>
      </div>
      <div class="card-subtitle">${h.club_display_name}</div>
    </div>
    <div class="card-body">
      <div class="transfer-direction">
        <span class="direction-arrow ${dirClass}">${direction}</span>
        <div class="transfer-details">
          <div>${h.from} → ${h.to}</div>
          <div>${h.value}</div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <div class="metric">
        <div class="metric-label">Prob</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${prob}%"></div></div>
        <div class="metric-value">${prob}%</div>
      </div>
    </div>
  </a>`;
}
