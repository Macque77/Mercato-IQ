<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mercato IQ mark">
  <defs>
    <radialGradient id="ballFill" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#2b2f38"/>
      <stop offset="55%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- metallic green: banded light/dark stops read as a brushed-steel sheen -->
    <linearGradient id="greenArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#d4f7c5"/>
      <stop offset="18%" stop-color="#5fcf6a"/>
      <stop offset="38%" stop-color="#127a34"/>
      <stop offset="55%" stop-color="#6fe07a"/>
      <stop offset="72%" stop-color="#1a8f3d"/>
      <stop offset="100%" stop-color="#063d18"/>
    </linearGradient>
    <linearGradient id="greenArcHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafff0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#eafff0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#eafff0" stop-opacity="0.55"/>
    </linearGradient>

    <!-- metallic red: same banding treatment for the outgoing arc -->
    <linearGradient id="redArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffd3cf"/>
      <stop offset="18%" stop-color="#ff5b4e"/>
      <stop offset="38%" stop-color="#951712"/>
      <stop offset="55%" stop-color="#ff6a5c"/>
      <stop offset="72%" stop-color="#ab1c15"/>
      <stop offset="100%" stop-color="#4a0906"/>
    </linearGradient>
    <linearGradient id="redArcHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1ef" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#fff1ef" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff1ef" stop-opacity="0.55"/>
    </linearGradient>

    <!-- chrome accent for the ball's seams / centre stud -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f7f9"/>
      <stop offset="30%" stop-color="#aab4bd"/>
      <stop offset="55%" stop-color="#5b6570"/>
      <stop offset="80%" stop-color="#c7d0d7"/>
      <stop offset="100%" stop-color="#7c848d"/>
    </linearGradient>

    <filter id="markGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- orbiting exchange ring: metallic green = incoming flow, metallic red = outgoing flow.
       arrow tips are concave darts (not flat-backed triangles) so direction reads clearly. -->
  <g filter="url(#markGlow)" fill="none" stroke-linecap="round">
    <path d="M13.0 42.9 A50 50 0 0 1 109.2 51.3" stroke="url(#greenArc)" stroke-width="6.5"/>
    <path d="M13.0 42.9 A50 50 0 0 1 109.2 51.3" stroke="url(#greenArcHi)" stroke-width="1.6" opacity="0.8"/>
    <polygon points="109.2,51.3 100.4,47.9 105.27,52.41 104.9,58.4" fill="url(#greenArc)" stroke="#eafff0" stroke-width="0.4" stroke-opacity="0.5"/>

    <path d="M107.0 77.1 A50 50 0 0 1 10.8 68.7" stroke="url(#redArc)" stroke-width="6.5"/>
    <path d="M107.0 77.1 A50 50 0 0 1 10.8 68.7" stroke="url(#redArcHi)" stroke-width="1.6" opacity="0.8"/>
    <polygon points="10.8,68.7 19.6,72.1 14.73,67.59 15.1,61.6" fill="url(#redArc)" stroke="#fff1ef" stroke-width="0.4" stroke-opacity="0.5"/>
  </g>

  <!-- the ball -->
  <circle cx="60" cy="60" r="38" fill="url(#ballFill)" stroke="#3a3f4b" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#chrome)" stroke-width="1" opacity="0.4"/>
  <ellipse cx="46" cy="42" rx="20" ry="14" fill="url(#sheen)"/>

  <!-- classic pentagon facet + seams, now chrome instead of gold -->
  <g stroke="url(#chrome)" stroke-width="1" opacity="0.65" fill="none" stroke-linecap="round">
    <line x1="60" y1="48" x2="60" y2="22"/>
    <line x1="71.41" y1="56.29" x2="96.14" y2="48.26"/>
    <line x1="67.05" y1="69.71" x2="82.34" y2="90.74"/>
    <line x1="52.95" y1="69.71" x2="37.66" y2="90.74"/>
    <line x1="48.59" y1="56.29" x2="23.86" y2="48.26"/>
  </g>
  <polygon points="60,48 71.41,56.29 67.05,69.71 52.95,69.71 48.59,56.29"
           fill="#14161b" stroke="url(#chrome)" stroke-width="1.4"/>
  <circle cx="60" cy="60" r="3.1" fill="url(#chrome)"/>
</svg>
