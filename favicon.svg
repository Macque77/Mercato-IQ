<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mercato IQ mark">
  <!-- Favicon-specific simplified variant: flat fills, thick strokes, no gradients/blur/fine seams —
       optimized for legibility at 16-32px browser-tab scale (the full metallic mercato-mark.svg
       loses all detail below ~64px). Same silhouette/colour language as the primary mark. -->
  <circle cx="60" cy="60" r="58" fill="#0b0c0f"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#2c2f38" stroke-width="2"/>

  <g fill="none" stroke-linecap="round">
    <path d="M13.0 42.9 A50 50 0 0 1 109.2 51.3" stroke="#33c46a" stroke-width="12"/>
    <polygon points="109.2,51.3 96.0,45.5 103.0,53.0 102.4,61.5" fill="#33c46a"/>

    <path d="M107.0 77.1 A50 50 0 0 1 10.8 68.7" stroke="#e2454a" stroke-width="12"/>
    <polygon points="10.8,68.7 24.0,74.5 17.0,67.0 17.6,58.5" fill="#e2454a"/>
  </g>

  <circle cx="60" cy="60" r="30" fill="#16181d" stroke="#3a3f4b" stroke-width="2"/>
  <circle cx="60" cy="60" r="5.5" fill="#c7d0d7"/>
</svg>
