<style>

    --primary:{{PRIMARY}};
    --primary-bright:{{PRIMARY_BRIGHT}};

    --border:#3a4452;
    --text:#f0f2f5;
    --text-secondary:#a8adb8;
    --text-muted:#7a8291;
    --accent-gold:#e8c249;
    --accent-red:#ff3d47;
    --accent-green:#2ecc71;
    --tier1:#2ecc71;
    --tier2:#e8c249;
    --tier3:#f39c12;
    --bullshit:#ff6b6b;
    --display:'Anton',sans-serif;
    --body:'Archivo',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER ===== */
  header {
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(180deg, rgba(10,14,23,0.98), rgba(10,14,23,0.88));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:16px 24px;
  }

  .header-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
  }

  .logo {
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:inherit;
  }

  .logo h1 {
    font-family:var(--display);
    font-size:16px;
    font-weight:400;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .breadcrumb {
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .breadcrumb a {
    color:var(--text-secondary);
    text-decoration:none;
  }

  .breadcrumb a:hover {
    color:var(--primary-bright);
  }

  /* ===== HERO ===== */
  .hero {
    background:linear-gradient(135deg, rgba(var(--primary), 0.1), rgba(255,61,71,0.05));
    border-bottom:1px solid var(--border);
    padding:40px 24px;
  }

  .hero-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:32px;
  }

  .club-badge-large {
    width:80px;
    height:80px;
    background:var(--surface);
    border:2px solid var(--primary);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    flex-shrink:0;
  }

  .hero-text h2 {
    font-family:var(--display);
    font-size:clamp(28px, 4vw, 44px);
    font-weight:400;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:12px;
  }

  .hero-text .subtitle {
    color:var(--text-secondary);
    font-size:16px;
  }

  /* ===== CONTAINER ===== */
  .container {
    max-width:1400px;
    margin:0 auto;
    padding:48px 24px;
  }

  /* ===== TRANSFER FEED ===== */
  .section {
    margin-bottom:48px;
  }

  .section-title {
    font-family:var(--display);
    font-size:24px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:24px;
    padding-bottom:12px;
    border-bottom:2px solid var(--primary);
  }

  .transfer-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
    gap:20px;
  }

  .transfer-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    transition:all 300ms ease;
    position:relative;
  }

  .transfer-card:hover {
    border-color:var(--primary-bright);
    transform:translateY(-4px);
    box-shadow:0 12px 24px rgba(0,0,0,0.3);
  }

  .card-header {
    padding:16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(135deg, rgba(var(--primary), 0.08), rgba(255,61,71,0.04));
  }

  .card-player {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }

  .player-name {
    font-family:var(--display);
    font-size:16px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .tier-badge {
    display:inline-block;
    padding:4px 8px;
    background:var(--bg);
    border:1px solid;
    border-radius:4px;
    font-family:var(--mono);
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .tier-badge.t1 { color:var(--tier1); border-color:var(--tier1); }
  .tier-badge.t2 { color:var(--tier2); border-color:var(--tier2); }
  .tier-badge.t3 { color:var(--tier3); border-color:var(--tier3); }
  .tier-badge.bullshit { color:var(--bullshit); border-color:var(--bullshit); }

  .source-info {
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-secondary);
  }

  .card-body {
    padding:16px;
  }

  .note {
    background:rgba(232,194,73,0.08);
    border-left:3px solid var(--accent-gold);
    padding:12px;
    border-radius:6px;
    font-size:14px;
    line-height:1.6;
    color:var(--text-secondary);
  }

  .note.bullshit {
    background:rgba(255,107,107,0.08);
    border-left-color:var(--bullshit);
    color:var(--text);
  }

  .card-footer {
    padding:16px;
    border-top:1px solid var(--border);
    display:flex;
    gap:16px;
  }

  .metric {
    flex:1;
  }

  .metric-label {
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:6px;
  }

  .metric-bar {
    height:4px;
    background:rgba(0,0,0,0.2);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:4px;
  }

  .metric-fill {
    height:100%;
    background:linear-gradient(90deg, var(--accent-gold), var(--primary-bright));
    border-radius:999px;
  }

  .metric-value {
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    color:var(--text);
  }

  /* ===== BULLSHIT CALLOUT ===== */
  .bullshit-tag {
    position:absolute;
    top:12px;
    right:12px;
    background:var(--bullshit);
    color:white;
    padding:6px 10px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    animation:shake 3s ease-in-out infinite;
  }

  @keyframes shake {
    0%, 100% { transform:rotate(-2deg); }
    50% { transform:rotate(2deg); }
  }

  /* ===== EMPTY STATE ===== */
  .empty {
    text-align:center;
    padding:60px 24px;
    color:var(--text-muted);
  }

  /* ===== FOOTER ===== */
  footer {
    border-top:1px solid var(--border);
    padding:48px 24px;
    text-align:center;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:12px;
  }

  @media(max-width:768px) {
    .transfer-grid {
      grid-template-columns:1fr;
    }

    .hero-inner {
      flex-direction:column;
      text-align:center;
      gap:24px;
    }
  }

(function(){
  const rs = document.documentElement.style;
  if(typeof BRAND !== 'undefined') {
    rs.setProperty('--primary', BRAND.primary);
    rs.setProperty('--primary-bright', BRAND.primaryBright);
  }
  document.title = 'Mercato IQ: ' + (BRAND ? BRAND.club : 'Transfers');

  // Render confirmed IN
  if(typeof CONFIRMED_IN !== 'undefined') {
    const confirmed = document.getElementById('confirmed');
    if(confirmed) {
      if(CONFIRMED_IN.length > 0) {
        confirmed.innerHTML = CONFIRMED_IN.map(t => renderCard(t)).join('');
      } else {
        confirmed.innerHTML = '<div class="empty">No confirmed transfers yet</div>';
      }
    }
  }

  // Render rumors/incoming
  if(typeof INCOMING !== 'undefined') {
    const rumors = document.getElementById('rumors');
    if(rumors) {
      if(INCOMING.length > 0) {
        rumors.innerHTML = INCOMING.map(t => renderCard(t)).join('');
      } else {
        rumors.innerHTML = '<div class="empty">No active rumors yet</div>';
      }
    }
  }
})();

function renderCard(t) {
  const tier = t.tier || 3;
  const tierLabel = ['', 'Tier 1', 'Tier 2', 'Tier 3'][tier] || 'T' + tier;
  const truth = t.truth || 50;
  const prob = t.prob || 50;
  const isBullshit = t.light === 'r' && truth < 40 && prob < 35;
  const bullTag = isBullshit ? '<div class="bullshit-tag">BULLSHIT</div>' : '';
  const noteClass = isBullshit ? ' bullshit' : '';

  return `<div class="transfer-card">
    ${bullTag}
    <div class="card-header">
      <div class="card-player">
        <span class="player-name">${t.name}</span>
        <span class="tier-badge t${tier}">${tierLabel}</span>
      </div>
      <div class="source-info">${t.src || 'Unknown'}</div>
    </div>
    <div class="card-body">
      <div class="note${noteClass}">${t.note || 'No details'}</div>
    </div>
    <div class="card-footer">
      <div class="metric">
        <div class="metric-label">Truth</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${truth}%"></div></div>
        <div class="metric-value">${truth}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Probability</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${prob}%"></div></div>
        <div class="metric-value">${prob}%</div>
      </div>
    </div>
  </div>`;
}
</script>
