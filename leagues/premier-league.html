<style>

    --bg:#0a0e17;
    --surface:#1a2332;
    --border:#3a4452;
    --text:#f0f2f5;
    --text-secondary:#a8adb8;
    --text-muted:#7a8291;
    --accent-gold:#e8c249;
    --accent-red:#ff3d47;
    --accent-green:#2ecc71;
    --tier1:#2ecc71;
    --tier2:#e8c249;
    --tier3:#f39c12;

    --body:'Archivo',sans-serif;
    --mono:'JetBrains Mono',monospace;

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

    z-index:100;

    border-bottom:1px solid var(--border);
    padding:10px 20px;
  }

  .header-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }

  .logo {
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:inherit;
    font-family:var(--display);
    font-size:15px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .logo img {
    width:36px;
    height:36px;
    display:block;
  }

  .flag-mini {
    width:16px;
    height:12px;
    object-fit:cover;
    border-radius:2px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.15);
    vertical-align:middle;
    margin-right:4px;
  }

  .breadcrumb {
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .breadcrumb a {
    color:var(--text-secondary);
    text-decoration:none;
    cursor:pointer;
  }

  .breadcrumb a:hover {
    color:var(--accent-gold);
  }

  /* ===== HERO ===== */

    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
    border-bottom:1px solid var(--border);
    padding:24px 20px;
  }

  .hero-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:20px;
  }

  .hero-icon {
    font-size:40px;
    line-height:1;
    flex-shrink:0;
  }

  .hero-text h2 {
    font-family:var(--display);
    font-size:32px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }

  .hero-text .subtitle {
    color:var(--text-secondary);
    font-size:13px;
    display:flex;
    gap:16px;
  }

  .stat {
    display:flex;
    gap:4px;
    font-family:var(--mono);
    font-size:11px;
  }

  .stat-label {
    color:var(--text-muted);
    text-transform:uppercase;
  }

  .stat-value {
    color:var(--accent-gold);
    font-weight:700;
  }

  /* ===== CONTAINER ===== */

    max-width:1400px;
    margin:0 auto;

    letter-spacing:0.3px;
    text-transform:uppercase;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--accent-gold);
  }

  .clubs-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
    gap:8px;
    margin-bottom:24px;
  }

  .club-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
    text-align:center;
    cursor:pointer;
    transition:all 200ms ease;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-height:90px;
    justify-content:center;
  }

  .club-card:hover {
    border-color:var(--accent-gold);
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
  }

  .club-badge {
    width:36px;
    height:36px;
    margin:0 auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.3px;
    color:var(--accent-gold);
    background:linear-gradient(135deg, rgba(232,194,73,0.18), rgba(255,255,255,0.04));
    border:1px solid rgba(232,194,73,0.35);
    overflow:hidden;
  }

  .club-badge img {
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
  }

  .empty {
    grid-column:1/-1;
    text-align:center;
    padding:32px 20px;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:12px;
    border:1px dashed var(--border);
    border-radius:8px;
  }

  .club-name {
    font-family:var(--display);
    font-size:10px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.2px;
    word-wrap:break-word;
  }

    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:12px;
  }

  .transfer-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    transition:all 200ms ease;
    position:relative;
  }

  .transfer-card:hover {

    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);

    display:block;
    color:inherit;
    text-decoration:none;
    cursor:pointer;

    background:var(--accent-red);
    color:white;

    border-radius:4px;
    font-family:var(--mono);

    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;

    gap:10px;

    text-transform:uppercase;

    height:3px;

    margin-bottom:2px;

    height:100%;

  if(typeof CLUBS_LIST !== 'undefined' && CLUBS_LIST && CLUBS_LIST.length > 0) {
    const container = document.getElementById('clubs-grid');
    container.innerHTML = CLUBS_LIST.map(c => {
      const badgeInner = c.badge
        ? `<img src="../badges-thumb/${c.slug}.png" alt="${c.name} badge" loading="lazy" onerror="this.parentElement.textContent='${initials(c.name)}'">`
        : initials(c.name);
      return `
      <a href="../${c.slug}.html" class="club-card">
        <div class="club-badge">${badgeInner}</div>
        <div class="club-name">${c.name}</div>
      </a>
    `;
    }).join('');
  } else {
    const container = document.getElementById('clubs-grid');
    if(container) container.innerHTML = '<div class="empty">No club data yet</div>';
  }

  // Populate transfer stories
  if(typeof TOP_STORIES !== 'undefined' && TOP_STORIES && TOP_STORIES.length > 0) {
    const container = document.getElementById('stories');
    container.innerHTML = TOP_STORIES.map(s => renderStory(s)).join('');
  } else {
    const container = document.getElementById('stories');
    if(container) container.innerHTML = '<div class="empty">No stories yet</div>';
  }
})();

function renderStory(s) {
  const tier = s.tier || 3;
  const tierLabel = ['', 'T1', 'T2', 'T3'][tier] || 'T' + tier;
  const prob = s.prob || 50;
  const isBullshit = prob < 35;
  const direction = s.direction === 'out' ? '→' : '←';
  const dirClass = s.direction === 'out' ? 'out' : 'in';
  const bullTag = isBullshit ? '<div class="bullshit-tag">Bullshit</div>' : '';
  const href = s.club_origin ? `../${s.club_origin}.html` : '#';

  return `<a href="${href}" class="transfer-card">
    ${bullTag}
    <div class="card-header">
      <div class="card-player">
        <span class="player-name">${s.name}</span>
        <span class="tier-badge t${tier}">${tierLabel}</span>
      </div>
      <div class="club-name-card">${s.club_display_name}</div>
    </div>
    <div class="card-body">
      <div class="transfer-direction">
        <span class="direction-icon ${dirClass}">${direction}</span>
        <div class="transfer-details">
          <div>${s.from} → ${s.to}</div>
          <div>${s.value}</div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <div class="metric">
        <div class="metric-label">Prob</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${prob}%"></div></div>
        <div class="metric-value">${prob}%</div>
      </div>
    </div>
  </a>`;
}
</script>

</body>
</html>
