<style>
  :root {
    --bg:#0a0e17;
    --surface:#1a2332;
    --border:#3a4452;
    --text:#f0f2f5;
    --text-secondary:#a8adb8;
    --text-muted:#7a8291;
    --accent-gold:#e8c249;
    --accent-red:#ff3d47;
    --accent-green:#2ecc71;
    --tier1:#2ecc71;
    --tier2:#e8c249;
    --tier3:#f39c12;
    --display:'Anton',sans-serif;
    --body:'Archivo',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER ===== */
  header {
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(180deg, rgba(10,14,23,0.98), rgba(10,14,23,0.88));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:10px 20px;
  }

  .header-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }

  .logo {
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:inherit;
    font-family:var(--display);
    font-size:15px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .logo img {
    width:36px;
    height:36px;
    display:block;
  }

  .flag-mini {
    width:16px;
    height:12px;
    object-fit:cover;
    border-radius:2px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.15);
    vertical-align:middle;
    margin-right:4px;
  }

  .breadcrumb {
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    color:var(--text-muted);
    flex:1 1 auto;
    min-width:0;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
  }

  .breadcrumb::-webkit-scrollbar { display:none; }

  .breadcrumb a {
    color:var(--text-secondary);
    text-decoration:none;
    cursor:pointer;
  }

  .breadcrumb a:hover {
    color:var(--accent-gold);
  }

  /* ===== BREAKING TICKER (Sky Sports News style) ===== */
  .ticker-bar {
    display:none;
    align-items:stretch;
    background:linear-gradient(90deg, #2c0a0d, #1a2332 55%);
    border-bottom:1px solid var(--border);
    overflow:hidden;
    position:relative;
  }

  .ticker-label {
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--accent-red);
    color:#0a0e17;
    font-family:var(--mono);
    font-size:10px;
    font-weight:700;
    letter-spacing:1.2px;
    padding:7px 14px;
    text-transform:uppercase;
    z-index:2;
    box-shadow:6px 0 10px -2px rgba(0,0,0,0.45);
  }

  .ticker-dot {
    width:6px;
    height:6px;
    border-radius:50%;
    background:#0a0e17;
    animation:ticker-pulse 1.3s infinite;
    flex:none;
  }

  @keyframes ticker-pulse {
    0%, 100% { opacity:1; }
    50% { opacity:0.25; }
  }

  .ticker-viewport {
    flex:1;
    overflow:hidden;
    position:relative;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
  }

  .ticker-track {
    display:flex;
    align-items:center;
    width:max-content;
    animation-name:ticker-scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    animation-duration:40s;
  }

  .ticker-bar:hover .ticker-track,
  .ticker-bar:focus-within .ticker-track {
    animation-play-state:paused;
  }

  @keyframes ticker-scroll {
    from { transform:translateX(0); }
    to { transform:translateX(-50%); }
  }

  .ticker-item {
    flex:none;
    display:flex;
    align-items:center;
    gap:9px;
    padding:7px 22px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-secondary);
    text-decoration:none;
    border-right:1px solid rgba(255,255,255,0.08);
    white-space:nowrap;
    transition:color 0.15s;
  }

  .ticker-item:hover { color:var(--text); }
  .ticker-item .t-name { color:var(--text); font-weight:700; }
  .ticker-item .t-route { color:var(--text-muted); }
  .ticker-item .t-prob { font-weight:700; }
  .ticker-item .t-prob.g { color:var(--accent-green); }
  .ticker-item .t-prob.y { color:var(--accent-gold); }
  .ticker-item .t-prob.o { color:#f39c12; }
  .ticker-item .t-prob.r { color:var(--accent-red); }
  .ticker-item .t-tier {
    font-size:8px;
    padding:1px 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation:none; overflow-x:auto; }
  }

  @media(max-width:768px) {
    .ticker-label { font-size:9px; padding:6px 9px; }
    .ticker-item { font-size:10px; padding:6px 14px; gap:6px; }
    .ticker-item .t-club { display:none; }
  }

  /* ===== HERO ===== */
  .hero {
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
    border-bottom:1px solid var(--border);
    padding:24px 20px;
  }

  .hero-inner {
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:20px;
  }

  .hero-icon {
    font-size:40px;
    line-height:1;
    flex-shrink:0;
  }

  .hero-text h2 {
    font-family:var(--display);
    font-size:32px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }

  .hero-text .subtitle {
    color:var(--text-secondary);
    font-size:13px;
    display:flex;
    gap:16px;
  }

  .stat {
    display:flex;
    gap:4px;
    font-family:var(--mono);
    font-size:11px;
  }

  .stat-label {
    color:var(--text-muted);
    text-transform:uppercase;
  }

  .stat-value {
    color:var(--accent-gold);
    font-weight:700;
  }

  /* ===== CONTAINER ===== */
  .container {
    max-width:1400px;
    margin:0 auto;
    padding:28px 20px;
  }

  /* ===== CLUBS SECTION ===== */
  .section {
    margin-bottom:28px;
  }

  .section-title {
    font-family:var(--display);
    font-size:18px;
    font-weight:400;
    letter-spacing:0.3px;
    text-transform:uppercase;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--accent-gold);
  }

  .clubs-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
    gap:8px;
    margin-bottom:24px;
  }

  .club-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
    text-align:center;
    cursor:pointer;
    transition:all 200ms ease;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-height:90px;
    justify-content:center;
  }

  .club-card:hover {
    border-color:var(--accent-gold);
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
  }

  .club-badge {
    width:36px;
    height:36px;
    margin:0 auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.3px;
    color:var(--accent-gold);
    background:linear-gradient(135deg, rgba(232,194,73,0.18), rgba(255,255,255,0.04));
    border:1px solid rgba(232,194,73,0.35);
    overflow:hidden;
  }

  /* Fallback crest tile for clubs with no real badge artwork: a small monogram
     rendered in the club's own brand colour so it reads as a deliberate crest
     rather than a missing-image placeholder. */
  .club-badge.mono-crest {
    background: linear-gradient(135deg, var(--crest-a, rgba(232,194,73,0.28)), var(--crest-b, rgba(255,255,255,0.05)));
    border-color: var(--crest-border, rgba(232,194,73,0.4));
    color: var(--crest-ink, var(--accent-gold));
    font-weight:600;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }

  .club-badge img {
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
  }

  .empty {
    grid-column:1/-1;
    text-align:center;
    padding:32px 20px;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:12px;
    border:1px dashed var(--border);
    border-radius:8px;
  }

  .club-name {
    font-family:var(--display);
    font-size:10px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.2px;
    word-wrap:break-word;
  }

  .transfer-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:12px;
  }

  .transfer-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    transition:all 200ms ease;
    position:relative;
  }

  .transfer-card:hover {
    border-color:var(--accent-gold);
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.3);
  }

  a.transfer-card {
    display:block;
    color:inherit;
    text-decoration:none;
    cursor:pointer;
  }

  .bullshit-tag {
    position:absolute;
    top:8px;
    right:8px;
    background:var(--accent-red);
    color:white;
    padding:4px 8px;
    border-radius:4px;
    font-family:var(--mono);
    font-size:8px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    animation:shake 3s ease-in-out infinite;
    z-index:1;
  }

  @keyframes shake {
    0%, 100% { transform:rotate(-2deg); }
    50% { transform:rotate(2deg); }
  }

  .card-header {
    padding:10px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(135deg, rgba(232,194,73,0.08), rgba(255,61,71,0.04));
  }

  .card-player {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
    gap:6px;
  }

  .player-name {
    font-family:var(--display);
    font-size:13px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:0.3px;
    color:var(--accent-gold);
  }

  .tier-badge {
    display:inline-block;
    padding:2px 6px;
    background:var(--bg);
    border:1px solid;
    border-radius:3px;
    font-family:var(--mono);
    font-size:8px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    white-space:nowrap;
  }

  .tier-badge.t1 { color:var(--tier1); border-color:var(--tier1); }
  .tier-badge.t2 { color:var(--tier2); border-color:var(--tier2); }
  .tier-badge.t3 { color:var(--tier3); border-color:var(--tier3); }

  .club-name-card {
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
  }

  .card-body {
    padding:10px;
  }

  .transfer-direction {
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-size:11px;
  }

  .direction-icon {
    font-size:14px;
  }

  .direction-icon.in { color:var(--accent-green); }
  .direction-icon.out { color:var(--accent-red); }

  .transfer-details {
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
    line-height:1.4;
  }

  .transfer-details div:last-child {
    color:var(--accent-gold);
    margin-top:3px;
  }

  .card-footer {
    padding:10px;
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
  }

  .metric {
    flex:1;
  }

  .metric-label {
    font-family:var(--mono);
    font-size:8px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:3px;
  }

  .metric-bar {
    height:3px;
    background:rgba(0,0,0,0.3);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:2px;
  }

  .metric-fill {
    height:100%;
    /* Fallback only -- actual colour is set inline per-card by metricGradient(), driven
       by the value itself (see script below), so this static gradient is rarely seen. */
    background:linear-gradient(90deg, var(--accent-gold), var(--accent-red));
    border-radius:999px;
  }

  .metric-value {
    font-family:var(--mono);
    font-size:9px;
    font-weight:600;
    color:var(--text);
  }

  footer {
    border-top:1px solid var(--border);
    padding:20px 24px;
    text-align:center;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:10px;
  }

  @media(max-width:768px) {
    .hero-inner {
      flex-direction:column;
      text-align:center;
      gap:16px;
    }

    .hero-text .subtitle {
      flex-direction:column;
      gap:10px;
    }

    .transfer-grid {
      grid-template-columns:1fr;
    }

    .clubs-grid {
      grid-template-columns:repeat(auto-fill, minmax(90px, 1fr));
    }

    .logo {
      font-size:11px;
    }

    .hero-text h2 {
      font-size:24px;
    }
  }
</style>
</head>

function initials(name) {
  return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

// Prob metric bar: colour driven by the value itself, on the same four-band scale as
// the decoder legend (Likely 50%+ / Live in the mix / Long shot / Unlikely). Bands
// match the site-wide light-band rule: g>50, y>=30, o>=15, r<15.
// Declared before the render IIFE below so it's initialised before first use.
const METRIC_BAND_COLORS = { g: '46,204,113', y: '232,194,73', o: '243,156,18', r: '255,61,71' };
function metricBand(v) {
  const n = Number(v) || 0;
  if (n > 50) return 'g';
  if (n >= 30) return 'y';
  if (n >= 15) return 'o';
  return 'r';
}
function metricGradient(v) {
  const rgb = METRIC_BAND_COLORS[metricBand(v)];
  return `linear-gradient(90deg, rgba(${rgb},0.45), rgb(${rgb}))`;
}

function hexToRgba(hex, alpha) {
  const h = (hex || '#E8C249').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(full, 16);
  if (isNaN(n)) return `rgba(232,194,73,${alpha})`;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

// Relative luminance (0-1) of a hex colour, used to guard legibility on the dark
// fallback crest tile -- clubs whose real colours are near-black (Juventus, Udinese)
// would otherwise render an unreadable ink colour against the dark card background.
function luminance(hex) {
  const h = (hex || '#E8C249').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(full, 16);
  if (isNaN(n)) return 0.6;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

// Pick a legible ink colour for the mono-crest tile: the club's bright brand colour
// when it reads clearly on a dark background, otherwise a neutral light fallback.
function crestInk(primary, primaryBright) {
  const candidate = primaryBright || primary;
  return luminance(candidate) < 0.38 ? '#E9E9EE' : candidate;
}

(function(){
  // Populate clubs grid. aggregate.py emits this array as CLUBS_LIST with a
  // {slug,name,count,badge,primary,primaryBright} shape -- NOT "CLUBS" (that mismatch used
  // to leave this grid permanently empty even when club data existed). badge=true means a
  // thumbnail exists in badges-thumb/<slug>.png; clubs without real artwork fall back to a
  // monogram tile rendered in the club's own brand colour, so it reads as a deliberate crest
  // rather than a missing-image placeholder.
  if(typeof CLUBS_LIST !== 'undefined' && CLUBS_LIST && CLUBS_LIST.length > 0) {
    const container = document.getElementById('clubs-grid');
    container.innerHTML = CLUBS_LIST.map(c => {
      const ink = crestInk(c.primary, c.primaryBright);
      const crestStyle = `--crest-a:${hexToRgba(c.primary, 0.32)};--crest-b:${hexToRgba(c.primaryBright || c.primary, 0.08)};--crest-border:${hexToRgba(c.primary, 0.55)};--crest-ink:${ink}`;
      const badgeInner = c.badge
        ? `<img src="../badges-thumb/${c.slug}.png" alt="${c.name} badge" loading="lazy" onerror="this.parentElement.classList.add('mono-crest'); this.parentElement.textContent='${initials(c.name)}'">`
        : initials(c.name);
      const badgeClass = c.badge ? 'club-badge' : 'club-badge mono-crest';
      return `
      <a href="../${c.slug}.html" class="club-card">
        <div class="${badgeClass}" style="${crestStyle}">${badgeInner}</div>
        <div class="club-name">${c.name}</div>
      </a>
    `;
    }).join('');
  } else {
    const container = document.getElementById('clubs-grid');
    if(container) container.innerHTML = '<div class="empty">No club data yet</div>';
  }

  // Populate transfer stories -- ranked by likelihood (Probability) descending
  if(typeof TOP_STORIES !== 'undefined' && TOP_STORIES && TOP_STORIES.length > 0) {
    const container = document.getElementById('stories');
    const ranked = TOP_STORIES.slice().sort((a, b) => (b.prob || 0) - (a.prob || 0));
    container.innerHTML = ranked.map(s => renderStory(s)).join('');
  } else {
    const container = document.getElementById('stories');
    if(container) container.innerHTML = '<div class="empty">No stories yet</div>';
  }

  // Breaking ticker: latest/highest-likelihood stories for this scope, excluding
  // flagged-bullshit claims.
  if(typeof TOP_STORIES !== 'undefined' && TOP_STORIES && TOP_STORIES.length > 0) {
    initTicker(TOP_STORIES.filter(s => !s.bullshit), renderTickerStory);
  }
})();

function slugifyName(s) {
  return (s || '').toString().toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// Sky Sports-style breaking ticker: a small, ranked snapshot (not the full feed),
// auto-scrolling via CSS transform (no real horizontal scrollbar), paused on hover
// and honouring prefers-reduced-motion. renderFn maps one story to a <a class="ticker-item">.
function initTicker(items, renderFn, limit) {
  const bar = document.getElementById('ticker-bar');
  const track = document.getElementById('ticker-track');
  if (!bar || !track || !items || items.length === 0) return;
  const top = items.slice().sort((a, b) => (b.prob || 0) - (a.prob || 0)).slice(0, limit || 15);
  if (top.length === 0) return;
  const html = top.map(renderFn).join('');
  track.innerHTML = html + html; // duplicated once for a seamless loop
  bar.style.display = 'flex';
  requestAnimationFrame(() => {
    const halfWidth = track.scrollWidth / 2;
    const duration = Math.max(22, Math.round(halfWidth / 55)); // ~55px/sec, floor for very short lists
    track.style.animationDuration = duration + 's';
  });
}

function renderTickerStory(s) {
  const tier = s.tier || 3;
  const prob = s.prob || 0;
  const band = metricBand(prob);
  const href = s.club_origin ? `../${s.club_origin}.html#t-${slugifyName(s.name)}` : '#';
  return `<a href="${href}" class="ticker-item">
    <span class="tier-badge t${tier} t-tier">T${tier}</span>
    <span class="t-name">${s.name}</span>
    <span class="t-club">${s.club_display_name}</span>
    <span class="t-route">${s.from} → ${s.to}</span>
    <span class="t-prob ${band}">${prob}%</span>
  </a>`;
}



function renderStory(s) {
  const tier = s.tier || 3;
  const tierLabel = ['', 'T1', 'T2', 'T3'][tier] || 'T' + tier;
  const prob = s.prob || 50;
  const isBullshit = s.bullshit === true;
  const bullTag = isBullshit ? '<div class="bullshit-tag">Bullshit</div>' : '';
  const href = s.club_origin ? `../${s.club_origin}.html#t-${slugifyName(s.name)}` : '#';

  return `<a href="${href}" class="transfer-card">
    ${bullTag}
    <div class="card-header">
      <div class="card-player">
        <span class="player-name">${s.name}</span>
        <span class="tier-badge t${tier}">${tierLabel}</span>
      </div>
      <div class="club-name-card">${s.club_display_name}</div>
    </div>
    <div class="card-body">
      <div class="transfer-direction">
        <div class="transfer-details">
          <div>${s.from} → ${s.to}</div>
          <div>${s.value}</div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <div class="metric">
        <div class="metric-label">Prob</div>
        <div class="metric-bar"><div class="metric-fill" style="width:${prob}%;background:${metricGradient(prob)}"></div></div>
        <div class="metric-value">${prob}%</div>
      </div>
    </div>
  </a>`;
}
